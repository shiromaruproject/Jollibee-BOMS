<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jollibee Business Operations Management System</title>
<style>
  :root{
    --red:#d71920;
    --red-dark:#aa0f16;
    --red-soft:#fff0f1;
    --cream:#fffaf5;
    --bg:#f5f7fa;
    --white:#ffffff;
    --ink:#17243a;
    --muted:#667085;
    --line:#e4e8ef;
    --green:#16935a;
    --green-soft:#e9f8f0;
    --yellow:#e9a000;
    --yellow-soft:#fff6dd;
    --blue:#2c73d2;
    --blue-soft:#eaf3ff;
    --purple:#7856d8;
    --purple-soft:#f1edff;
    --shadow:0 10px 28px rgba(23,36,58,.07);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
  button,input,select,textarea{font:inherit}
  button{cursor:pointer}
  .app{display:flex;min-height:100vh}
  .sidebar{
    width:258px;background:linear-gradient(180deg,#c90f18 0%,#990b12 100%);
    color:#fff;padding:20px 14px 16px;position:fixed;top:0;left:0;bottom:0;z-index:10;overflow:auto
  }
  .brand{display:flex;align-items:center;gap:11px;padding:2px 10px 24px}
  .brand-word{font-size:29px;font-weight:900;letter-spacing:-1.5px}
  .brand-bee{
    width:44px;height:44px;border-radius:50%;background:#fff;color:var(--red);display:grid;place-items:center;
    box-shadow:0 5px 15px rgba(0,0,0,.12);font-size:25px
  }
  .system-name{font-size:12px;opacity:.88;line-height:1.35;padding:0 10px 16px}
  .nav-section{margin-top:8px}
  .nav-btn{
    text-decoration:none;
    width:100%;border:0;background:transparent;color:#fff;padding:12px 12px;border-radius:10px;
    display:flex;align-items:center;gap:12px;text-align:left;font-size:14px;margin:3px 0;opacity:.95
  }
  .nav-btn:hover{background:rgba(255,255,255,.12)}
  .nav-btn.active{background:#fff;color:var(--red);font-weight:800;box-shadow:0 6px 14px rgba(0,0,0,.12)}
  .nav-icon{width:20px;text-align:center;font-size:16px}
  .nav-spacer{border-top:1px solid rgba(255,255,255,.25);margin:16px 10px 10px}
  .main{margin-left:258px;min-width:0;flex:1}
  .topbar{
    height:72px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;
    padding:0 28px;justify-content:space-between;position:sticky;top:0;z-index:8
  }
  .topbar-left{display:flex;align-items:center;gap:16px}
  .page-brand{font-size:17px;font-weight:800}
  .pill{background:#f3f4f6;color:#344054;border-radius:99px;padding:7px 11px;font-size:12px;font-weight:700}
  .topbar-right{display:flex;align-items:center;gap:18px}
  .branch{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700}
  .avatar{width:35px;height:35px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800}
  .user-mini{display:flex;align-items:center;gap:9px}
  .user-mini small{display:block;color:var(--muted);font-size:10px;margin-top:1px}
  .content{padding:28px;max-width:1600px;margin:0 auto}
  .page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:20px}
  .page-head h1{margin:0 0 5px;font-size:27px;letter-spacing:-.5px}
  .page-head p{margin:0;color:var(--muted);font-size:13px}
  .actions{display:flex;gap:9px;flex-wrap:wrap}
  .btn{
    border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;border-radius:9px;font-weight:800;font-size:13px
  }
  .btn:hover{border-color:#c8cfd9}
  .btn-primary{background:var(--red);border-color:var(--red);color:#fff}
  .btn-primary:hover{background:var(--red-dark)}
  .btn-success{background:var(--green);border-color:var(--green);color:#fff}
  .btn-danger{background:#c92a34;border-color:#c92a34;color:#fff}
  .btn-ghost{background:transparent}
  .grid{display:grid;gap:16px}
  .kpi-grid{grid-template-columns:repeat(5,minmax(0,1fr))}
  .card{
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)
  }
  .card.pad{padding:18px}
  .kpi{padding:17px}
  .kpi-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .kpi-title{color:var(--muted);font-size:12px;font-weight:700}
  .kpi-value{font-size:25px;font-weight:900;margin:8px 0 5px}
  .kpi-foot{font-size:11px;font-weight:700}
  .icon-box{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px}
  .soft-red{background:var(--red-soft);color:var(--red)}
  .soft-yellow{background:var(--yellow-soft);color:var(--yellow)}
  .soft-green{background:var(--green-soft);color:var(--green)}
  .soft-blue{background:var(--blue-soft);color:var(--blue)}
  .soft-purple{background:var(--purple-soft);color:var(--purple)}
  .up{color:var(--green)} .down{color:var(--red)}
  .dashboard-main{grid-template-columns:1.35fr 1fr}
  .dashboard-lower{grid-template-columns:1fr 1fr 1.05fr}
  .card-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
  .card-head h3{margin:0;font-size:15px}
  .card-body{padding:18px}
  .muted{color:var(--muted)}
  .activity{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid #edf0f4}
  .activity:last-child{border-bottom:0}
  .activity .time{margin-left:auto;white-space:nowrap;font-size:10px;color:var(--muted)}
  .activity b{display:block;font-size:12px}
  .activity span{display:block;font-size:10px;color:var(--muted);margin-top:3px}
  .trend{height:245px;display:flex;align-items:flex-end;gap:12px;padding:16px 8px 10px;border-bottom:1px solid var(--line)}
  .bar-wrap{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px}
  .bar{width:100%;max-width:42px;border-radius:7px 7px 0 0;background:linear-gradient(180deg,#ed2e35,#d71920)}
  .bar-label{font-size:10px;color:var(--muted)}
  .mini-list{display:grid;gap:11px}
  .product-row{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:9px}
  .food{
    width:36px;height:36px;border-radius:10px;background:var(--cream);display:grid;place-items:center;font-size:21px;border:1px solid #f0e9df
  }
  .product-row b{font-size:12px}.product-row small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
  .stock-row{display:flex;align-items:center;gap:10px;padding:7px 0}
  .dot{width:9px;height:9px;border-radius:50%}
  .dot.green{background:var(--green)} .dot.yellow{background:var(--yellow)} .dot.red{background:var(--red)} .dot.blue{background:var(--blue)}
  .quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .quick{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;text-align:left}
  .quick b{display:block;font-size:12px}.quick span{font-size:10px;color:var(--muted)}
  .toolbar{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:9px;margin-bottom:14px}
  .input,.select,.textarea{
    width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 12px;outline:0;color:var(--ink);font-size:12px
  }
  .input:focus,.select:focus,.textarea:focus{border-color:#d7a2a5;box-shadow:0 0 0 3px rgba(215,25,32,.07)}
  .table-wrap{overflow:auto}
  table{width:100%;border-collapse:collapse;min-width:800px}
  th,td{padding:12px 12px;text-align:left;border-bottom:1px solid #edf0f4;font-size:12px;white-space:nowrap}
  th{font-size:11px;color:#60708a;background:#fbfcfd;font-weight:800}
  td.num,th.num{text-align:right}
  tr:hover td{background:#fcfcfd}
  .status{
    display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:800
  }
  .status.pending{background:var(--yellow-soft);color:#9b6800}.status.paid,.status.approved,.status.delivered,.status.completed,.status.instock{background:var(--green-soft);color:#117347}
  .status.low{background:#fff4df;color:#a96c00}.status.out{background:#ffeaec;color:#a3141b}
  .status.draft{background:#f2f4f7;color:#667085}
  .section-gap{margin-top:16px}
  .form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .field label{display:block;font-size:11px;font-weight:800;margin:0 0 6px;color:#344054}
  .field.full{grid-column:1/-1}
  .items-table{min-width:900px}
  .summary{display:flex;justify-content:flex-end}
  .summary-box{width:360px;border-top:1px solid var(--line);padding-top:12px}
  .sum-row{display:flex;justify-content:space-between;padding:5px 0;font-size:12px}
  .sum-row.total{font-size:16px;font-weight:900;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
  .pos-grid{display:grid;grid-template-columns:1.65fr 1fr;gap:16px}
  .tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}
  .tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:11px;font-weight:800}
  .tab.active{background:var(--red);border-color:var(--red);color:#fff}
  .menu-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .menu-card{border:1px solid var(--line);border-radius:13px;padding:11px;background:#fff}
  .food-lg{height:105px;border-radius:10px;background:var(--cream);display:grid;place-items:center;font-size:56px;border:1px solid #f0e9df}
  .menu-card h4{margin:9px 0 2px;font-size:13px}.menu-card p{margin:0 0 10px;color:var(--muted);font-size:10px}
  .menu-foot{display:flex;align-items:center;justify-content:space-between}.price{font-weight:900;font-size:14px}
  .add{border:0;background:var(--red);color:#fff;border-radius:8px;padding:7px 10px;font-size:11px;font-weight:900}
  .order-card{position:sticky;top:88px}
  .order-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .meta-box{background:#fafbfc;border:1px solid var(--line);border-radius:9px;padding:9px}.meta-box small{display:block;color:var(--muted);font-size:9px}.meta-box b{font-size:11px}
  .order-line{display:grid;grid-template-columns:1fr 30px 75px 70px;gap:5px;align-items:center;border-bottom:1px solid #edf0f4;padding:9px 0;font-size:11px}
  .order-line .right{text-align:right}.qty{display:flex;gap:4px;align-items:center}.qty button{width:22px;height:22px;border:1px solid var(--line);border-radius:6px;background:#fff}
  .delete{border:0;background:transparent;color:#a4acb8;font-size:14px}
  .checkout-btn{width:100%;margin-top:12px;padding:13px;border:0;background:var(--red);color:#fff;border-radius:10px;font-weight:900}
  .pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .payment-methods{display:grid;gap:8px}
  .pay-option{display:flex;align-items:center;gap:9px;border:1px solid var(--line);padding:11px;border-radius:9px;font-size:12px;font-weight:800}
  .pay-option.active{border-color:var(--red);background:var(--red-soft);color:var(--red)}
  .pay-option input{accent-color:var(--red)}
  .receipt{border:1px dashed #d0d6df;border-radius:11px;padding:14px;background:#fcfcfd}
  .receipt-status{display:flex;align-items:center;gap:10px;border:1px solid #bde8cf;background:var(--green-soft);padding:11px;border-radius:9px;color:#117347;margin-top:12px}
  .receipt-status .check{width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
  .inventory-kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
  .two-col{display:grid;grid-template-columns:2fr 1fr;gap:16px}
  .alert{display:flex;gap:10px;align-items:flex-start;padding:11px;border:1px solid #f2deb2;background:#fffaf0;border-radius:9px;margin-bottom:9px}
  .alert b{font-size:12px;display:block}.alert span{font-size:10px;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:30px}
  .modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:30}
  .modal-backdrop.show{display:flex}
  .modal{background:#fff;border-radius:16px;max-width:760px;width:100%;box-shadow:0 25px 70px rgba(0,0,0,.2);max-height:92vh;overflow:auto}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px;border-bottom:1px solid var(--line)}
  .modal-head h3{margin:0;font-size:16px}.close{border:0;background:transparent;font-size:20px;color:var(--muted)}
  .modal-body{padding:18px}.modal-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
  .toast{position:fixed;right:22px;bottom:22px;background:#17243a;color:#fff;padding:12px 16px;border-radius:9px;font-size:12px;font-weight:800;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;z-index:50}
  .toast.show{opacity:1;transform:translateY(0)}
  .small-note{font-size:10px;color:var(--muted)}
  .footer-note{margin-top:20px;font-size:10px;color:#8a94a6;text-align:center}
  @media (max-width:1200px){
    .kpi-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    .dashboard-lower{grid-template-columns:1fr 1fr}
    .dashboard-lower > :last-child{grid-column:1/-1}
    .toolbar{grid-template-columns:1fr 1fr}
    .menu-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:900px){
    .sidebar{width:84px}.brand-word,.system-name,.nav-btn span:not(.nav-icon){display:none}.brand{justify-content:center;padding-inline:0}
    .nav-btn{justify-content:center}.main{margin-left:84px}
    .dashboard-main,.pos-grid,.pay-grid,.two-col{grid-template-columns:1fr}
    .order-card{position:static}
    .form-grid{grid-template-columns:1fr 1fr}
    .inventory-kpis{grid-template-columns:1fr 1fr}
  }
  @media (max-width:640px){
    .topbar{padding:0 14px}.branch,.user-mini > div{display:none}.content{padding:16px}
    .kpi-grid,.inventory-kpis,.dashboard-lower{grid-template-columns:1fr}
    .toolbar,.form-grid{grid-template-columns:1fr}
    .menu-grid{grid-template-columns:1fr}
    .page-head{flex-direction:column}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-word">Jollibee</div>
      <div class="brand-bee">🐝</div>
    </div>
    <div class="system-name">Business Operations Management System</div>

    <div class="nav-section">
      <a class="nav-btn active" data-page="dashboard" href="#dashboard"><span class="nav-icon">⌂</span><span>Dashboard</span></a>
      <a class="nav-btn" data-page="ordering" href="#ordering"><span class="nav-icon">🛒</span><span>Ordering to Supplier</span></a>
      <a class="nav-btn" data-page="supplier-payment" href="#supplier-payment"><span class="nav-icon">▣</span><span>Payment to Supplier</span></a>
      <a class="nav-btn" data-page="sales" href="#sales"><span class="nav-icon">🍔</span><span>Sales from Customer</span></a>
      <a class="nav-btn" data-page="customer-payment" href="#customer-payment"><span class="nav-icon">💳</span><span>Payment from Customer</span></a>
      <a class="nav-btn" data-page="inventory" href="#inventory"><span class="nav-icon">▧</span><span>Inventory</span></a>
    </div>
    <div class="nav-spacer"></div>
    <div class="nav-section">
      <a class="nav-btn" data-page="reports" href="#reports"><span class="nav-icon">▥</span><span>Reports</span></a>
      <a class="nav-btn" data-page="settings" href="#settings"><span class="nav-icon">⚙</span><span>Settings</span></a>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <div class="page-brand">Business Operations Management System</div>
        <span class="pill">Lipa Branch</span>
      </div>
      <div class="topbar-right">
        <div class="branch">🔔 <span id="notificationText">3 notifications</span></div>
        <div class="user-mini">
          <div class="avatar">JC</div>
          <div><strong style="font-size:12px">Juan Dela Cruz</strong><small>Branch Admin</small></div>
        </div>
      </div>
    </header>

    <section id="page" class="content"></section>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">Modal</h3>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const state = {
  page: "dashboard",
  cart: [
    {id:1,name:"1-pc Chickenjoy Meal",qty:2,price:95,emoji:"🍗"},
    {id:2,name:"Jolly Spaghetti",qty:1,price:60,emoji:"🍝"},
    {id:3,name:"Coke Regular",qty:2,price:45,emoji:"🥤"}
  ],
  supplierOrders: [
    {po:"PO-20261027-01",date:"Oct 27, 2026",supplier:"San Miguel Foods, Inc.",amount:31750,status:"Pending"},
    {po:"PO-20261024-02",date:"Oct 24, 2026",supplier:"Monde Nissin (Buns)",amount:12400,status:"Approved"},
    {po:"PO-20261020-03",date:"Oct 20, 2026",supplier:"Coca-Cola FEMSA",amount:8950,status:"Delivered"},
    {po:"PO-20261018-04",date:"Oct 18, 2026",supplier:"Nestlé Philippines",amount:15200,status:"Delivered"}
  ],
  supplierInvoices: [
    {inv:"INV-20261027-01",po:"PO-20261027-01",supplier:"San Miguel Foods, Inc.",date:"Oct 27, 2026",due:"Nov 10, 2026",amount:31750,status:"Outstanding"},
    {inv:"INV-20261024-02",po:"PO-20261024-02",supplier:"Monde Nissin (Buns)",date:"Oct 24, 2026",due:"Nov 08, 2026",amount:12400,status:"Paid"},
    {inv:"INV-20261020-03",po:"PO-20261020-03",supplier:"Coca-Cola FEMSA",date:"Oct 20, 2026",due:"Nov 03, 2026",amount:8950,status:"Paid"}
  ],
  inventory: [
    {item:"Chicken",cat:"Ingredient",stock:150,unit:"kg",reorder:50,status:"In Stock"},
    {item:"Cooking Oil",cat:"Ingredient",stock:35,unit:"L",reorder:40,status:"Low Stock"},
    {item:"Burger Buns",cat:"Ingredient",stock:300,unit:"pcs",reorder:100,status:"In Stock"},
    {item:"Paper Cups",cat:"Packaging",stock:1500,unit:"pcs",reorder:500,status:"In Stock"},
    {item:"Soft Drinks",cat:"Beverage",stock:80,unit:"pcs",reorder:100,status:"Low Stock"},
    {item:"French Fries",cat:"Ingredient",stock:25,unit:"kg",reorder:30,status:"Low Stock"},
    {item:"Tomato Sauce",cat:"Ingredient",stock:60,unit:"kg",reorder:20,status:"In Stock"}
  ],
  payments: [
    {time:"Oct 27, 2026 2:15 PM",order:"SO-20261027-045",type:"Dine-in",method:"Cash",amount:2350,status:"Paid"},
    {time:"Oct 27, 2026 1:12 PM",order:"SO-20261027-044",type:"Takeout",method:"GCash",amount:620,status:"Paid"},
    {time:"Oct 27, 2026 12:40 PM",order:"SO-20261027-043",type:"Delivery",method:"Card",amount:890,status:"Paid"}
  ],
  sales: [
    {so:"SO-20261027-045",time:"Oct 27, 2026 2:15 PM",type:"Dine-in",amount:2350,status:"Completed"},
    {so:"SO-20261027-044",time:"Oct 27, 2026 1:12 PM",type:"Takeout",amount:620,status:"Completed"},
    {so:"SO-20261027-043",time:"Oct 27, 2026 12:40 PM",type:"Delivery",amount:890,status:"Completed"}
  ]
};

const menu = [
  {id:101,name:"1-pc Chickenjoy Meal",category:"Chickenjoy",price:95,emoji:"🍗",desc:"1 pc Chickenjoy + rice + drink"},
  {id:102,name:"2-pc Chickenjoy Meal",category:"Chickenjoy",price:170,emoji:"🍗",desc:"2 pcs Chickenjoy + rice"},
  {id:103,name:"Chickenjoy Bucket",category:"Chickenjoy",price:499,emoji:"🍗",desc:"6 pcs Chickenjoy"},
  {id:104,name:"Yumburger",category:"Burgers",price:45,emoji:"🍔",desc:"Classic Jollibee Yumburger"},
  {id:105,name:"Cheesy Yumburger",category:"Burgers",price:55,emoji:"🍔",desc:"Yumburger with cheese"},
  {id:106,name:"Jolly Spaghetti",category:"Spaghetti",price:60,emoji:"🍝",desc:"Sweet-style Filipino spaghetti"},
  {id:107,name:"Coke Regular",category:"Drinks",price:45,emoji:"🥤",desc:"Regular soft drink"},
  {id:108,name:"Peach Mango Pie",category:"Desserts",price:45,emoji:"🥭",desc:"Crispy peach mango pie"},
  {id:109,name:"Jolly Crispy Fries",category:"Sides",price:60,emoji:"🍟",desc:"Crispy seasoned fries"}
];

let currentCategory = "All";

function peso(n){ return "₱" + Number(n).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function statusClass(s){
  const x=s.toLowerCase().replace(/\s/g,"");
  if(x.includes("low")) return "low"; if(x.includes("out")) return "out"; if(x==="draft") return "draft"; 
  if(x.includes("paid")||x.includes("approved")||x.includes("delivered")||x.includes("completed")||x.includes("instock")) return "paid";
  return "pending";
}
function showToast(msg){
  const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show");
  clearTimeout(window._toastTimer); window._toastTimer=setTimeout(()=>el.classList.remove("show"),2200);
}
const pageIds = new Set(["dashboard","ordering","supplier-payment","sales","customer-payment","inventory","reports","settings"]);
function pageFromHash(){
  const page=window.location.hash.slice(1);
  return pageIds.has(page)?page:"dashboard";
}
function setPage(page,updateHash=true){
  if(!pageIds.has(page)) page="dashboard";
  if(updateHash && window.location.hash!=="#"+page) window.location.hash=page;
  state.page=page;
  document.querySelectorAll(".nav-btn").forEach(b=>{
    const active=b.dataset.page===page;
    b.classList.toggle("active",active);
    if(active) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}
document.querySelectorAll(".nav-btn").forEach(btn=>btn.addEventListener("click",event=>{
  event.preventDefault();
  setPage(btn.dataset.page);
}));
window.addEventListener("hashchange",()=>setPage(pageFromHash(),false));

          <div class="summary section-gap"><div class="summary-box"><div class="sum-row"><span>Subtotal</span><b>${peso(subtotal)}</b></div><div class="sum-row"><span>VAT (12%)</span><span>${peso(vat)}</span></div><div class="sum-row total"><span>Total Due</span><b>${peso(total)}</b></div></div></div>
        </div>
      </div>

      <div class="card pad">
        <h3 style="margin:0 0 12px;font-size:15px">Customer Payment</h3>
        <div class="payment-methods" id="paymentMethods">
          <label class="pay-option active"><input type="radio" name="pm" value="Cash" checked> 💵 Cash</label>
          <label class="pay-option"><input type="radio" name="pm" value="GCash"> 📱 GCash</label>
          <label class="pay-option"><input type="radio" name="pm" value="Card"> 💳 Credit / Debit Card</label>
          <label class="pay-option"><input type="radio" name="pm" value="Other"> ▫ Other</label>
        </div>
        <div class="form-grid section-gap" style="grid-template-columns:1fr 1fr">
          <div class="field"><label>Amount Received</label><input class="input" id="amountReceived" value="${Math.ceil(total/100)*100}" type="number"></div>
          <div class="field"><label>Change</label><div class="input" id="changeDue" style="background:#fffaf0;color:#a96c00;font-weight:900">${peso(Math.max(0,Math.ceil(total/100)*100-total))}</div></div>
          <div class="field"><label>Reference Number</label><input class="input" id="customerRef" value="CASH-20261027-045"></div>
          <div class="field"><label>Payment Date</label><input class="input" value="Oct 27, 2026"></div>
          <div class="field full"><label>Notes</label><textarea class="textarea" rows="3">Payment received at Lipa Branch.</textarea></div>
        </div>
        <button class="checkout-btn" onclick="confirmCustomerPayment()">Confirm Payment</button>
        <div id="paymentResult"></div>
      </div>
    </div>
    <div class="card pad section-gap"><div class="card-head" style="padding:0 0 12px;border:0"><h3>Payment History</h3><button class="btn">View All</button></div>
      <div class="table-wrap"><table><thead><tr><th>Date & Time</th><th>Order No.</th><th>Order Type</th><th>Payment Method</th><th class="num">Amount</th><th>Status</th></tr></thead><tbody>
      ${state.payments.map(p=>`<tr><td>${p.time}</td><td>${p.order}</td><td>${p.type}</td><td>${p.method}</td><td class="num">${peso(p.amount)}</td><td><span class="status paid">${p.status}</span></td></tr>`).join("")}
      </tbody></table></div>
    </div>`;
}
function confirmCustomerPayment(){
  const subtotal=cartTotal(), total=subtotal*1.12;
  const amount=Number(document.getElementById("amountReceived").value)||0;
  if(amount<total){showToast("Amount received is less than total due.");return}
  const method=document.querySelector('input[name="pm"]:checked')?.value||"Cash";
  const now="Oct 27, 2026 2:15 PM";
  const so="SO-20261027-045";
  const tx="TRX-20261027-045";
  state.payments.unshift({time:now,order:so,type:"Dine-in",method,amount:total,status:"Paid"});
  state.sales.unshift({so,time:now,type:"Dine-in",amount:total,status:"Completed"});
  state.cart=[];
  document.getElementById("paymentResult").innerHTML=`<div class="receipt-status"><div class="check">✓</div><div><b style="font-size:12px">PAYMENT COMPLETED</b><div style="font-size:10px">Transaction Reference: ${tx} • ${method}</div></div></div>
  <div style="display:flex;gap:8px;margin-top:10px"><button class="btn" onclick="showToast('Receipt print dialog opened')">Print Receipt</button><button class="btn btn-primary" onclick="setPage('sales')">New Order</button></div>`;
  showToast(`Payment confirmed: ${peso(total)}`);
}

function renderInventory(){
  return `
    <div class="page-head"><div><h1>Inventory Management</h1><p>Monitor stock levels, receive deliveries, and manage inventory items.</p></div>
      <div class="actions">
        <button class="btn btn-primary" onclick="openInventoryModal('add')">＋ Add Item</button>
        <button class="btn" onclick="openInventoryModal('receive')">Receive Stock</button>
        <button class="btn" onclick="openInventoryModal('adjust')">Adjust Stock</button>
        <button class="btn" onclick="showToast('Inventory report generated')">Generate Report</button>
      </div>
    </div>
    <div class="grid inventory-kpis">
      ${statBlock("Total Items","125","soft-blue")}
      ${statBlock("Low Stock","12","soft-yellow")}
      ${statBlock("Out of Stock","3","soft-red")}
      ${statBlock("Pending Deliveries","5","soft-green")}
    </div>
    <div class="card pad section-gap">
      <div class="toolbar" style="grid-template-columns:1.4fr 1fr 1fr auto">
        <input class="input" id="inventorySearch" placeholder="Search item name...">
        <select class="select"><option>All Categories</option><option>Ingredient</option><option>Packaging</option><option>Beverage</option></select>
        <select class="select"><option>All Statuses</option><option>In Stock</option><option>Low Stock</option><option>Out of Stock</option></select>
        <button class="btn" onclick="showToast('Filters applied')">Filter</button>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Item</th><th>Category</th><th class="num">Current Stock</th><th>Unit</th><th class="num">Reorder Level</th><th>Status</th><th>Actions</th></tr></thead><tbody>
      ${state.inventory.map((x,i)=>`<tr><td><b>${x.item}</b></td><td>${x.cat}</td><td class="num">${x.stock.toLocaleString()}</td><td>${x.unit}</td><td class="num">${x.reorder}</td><td><span class="status ${statusClass(x.status)}">${x.status}</span></td><td><button class="btn" onclick="openInventoryItem(${i})">View</button> <button class="btn" onclick="openInventoryModal('adjust',${i})">⋮</button></td></tr>`).join("")}
      </tbody></table></div>
    </div>
    <div class="two-col section-gap">
      <div class="card pad"><div class="card-head" style="padding:0 0 12px;border:0"><h3>Low Stock Alerts</h3><button class="btn btn-primary" onclick="setPage('ordering')">Create Purchase Order</button></div>
        ${state.inventory.filter(x=>x.status==="Low Stock").map(x=>`<div class="alert"><div>⚠️</div><div><b>${x.item}</b><span>Current stock: ${x.stock} ${x.unit} • Reorder level: ${x.reorder} ${x.unit}</span></div><span style="margin-left:auto"><span class="status low">Low Stock</span></span></div>`).join("")}
      </div>
      <div class="card pad"><div class="card-head" style="padding:0 0 12px;border:0"><h3>Recent Stock Movements</h3></div>
        ${activity("📦","soft-green","Received from San Miguel Foods","Chicken, 200kg","Today 10:24 AM")}
        ${activity("🍔","soft-red","Sales Deduction","-50 kg Chicken","Today 9:10 AM")}
        ${activity("📦","soft-blue","Received from Monde Nissin","500 pcs Burger Buns","Oct 25")}
        ${activity("🥤","soft-yellow","Sales Deduction","-100 pcs Soft Drinks","Oct 25")}
      </div>
    </div>
  `;
}
function openInventoryModal(type,index){
  const title={add:"Add Inventory Item",receive:"Receive Stock",adjust:"Adjust Stock"}[type];
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalBody").innerHTML=`
    <div class="form-grid">
      <div class="field"><label>Item</label><input class="input" value="${index!=null?state.inventory[index].item:""}" placeholder="e.g. Chicken"></div>
      <div class="field"><label>Category</label><select class="select"><option>Ingredient</option><option>Packaging</option><option>Beverage</option></select></div>
      <div class="field"><label>Quantity</label><input class="input" type="number" value="${index!=null?state.inventory[index].stock:""}"></div>
      <div class="field"><label>Unit</label><input class="input" value="${index!=null?state.inventory[index].unit:"kg"}"></div>
      <div class="field"><label>Reorder Level</label><input class="input" type="number" value="${index!=null?state.inventory[index].reorder:50}"></div>
      <div class="field"><label>Reference</label><input class="input" value="SR-20261027-02"></div>
      <div class="field full"><label>Notes</label><textarea class="textarea" rows="3">Inventory update for Lipa Branch.</textarea></div>
    </div>`;
  document.getElementById("modalFoot").innerHTML=`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveInventoryChange('${type}',${index==null?"null":index})">Save</button>`;
  document.getElementById("modalBackdrop").classList.add("show");
}
function saveInventoryChange(type,index){
  if(type==="add") state.inventory.push({item:"New Item",cat:"Ingredient",stock:50,unit:"kg",reorder:20,status:"In Stock"});
  else if(index!=null){ state.inventory[index].stock += type==="receive"?50:-10; state.inventory[index].status=state.inventory[index].stock<=0?"Out of Stock":state.inventory[index].stock<=state.inventory[index].reorder?"Low Stock":"In Stock"; }
  closeModal(); showToast("Inventory updated successfully."); render();
}
function openInventoryItem(index){
  const x=state.inventory[index];
  document.getElementById("modalTitle").textContent=`${x.item} – Inventory Details`;
  document.getElementById("modalBody").innerHTML=`<div class="grid" style="grid-template-columns:repeat(3,1fr);gap:12px">${statBlock("Current Stock",`${x.stock} ${x.unit}`,"soft-blue")}${statBlock("Reorder Level",`${x.reorder} ${x.unit}`,"soft-yellow")}${statBlock("Status",x.status,"soft-green")}</div><div class="section-gap"><div class="small-note">Category: ${x.cat}</div><div class="small-note" style="margin-top:6px">Last updated: Oct 27, 2026 • 10:24 AM</div></div>`;
  document.getElementById("modalFoot").innerHTML=`<button class="btn" onclick="closeModal()">Close</button><button class="btn btn-primary" onclick="openInventoryModal('adjust',${index})">Adjust Stock</button>`;
  document.getElementById("modalBackdrop").classList.add("show");
}

    <div class="grid" style="grid-template-columns:1fr 1fr">

function closeModal(){document.getElementById("modalBackdrop").classList.remove("show")}
document.getElementById("modalBackdrop").addEventListener("click",(e)=>{if(e.target.id==="modalBackdrop")closeModal()});

function bindPageEvents(){
  const s=document.getElementById("orderSearch");
  if(s)s.addEventListener("input",()=>{const q=s.value.toLowerCase();document.querySelectorAll("#ordersTable tbody tr").forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?"":"none")});
  const is=document.getElementById("inventorySearch");
  if(is)is.addEventListener("input",()=>{const q=is.value.toLowerCase();document.querySelectorAll(".table-wrap tbody tr").forEach(r=>{if(r.children.length>5)r.style.display=r.innerText.toLowerCase().includes(q)?"":"none"})});
  document.querySelectorAll('#paymentMethods input').forEach(input=>input.addEventListener("change",e=>{
    document.querySelectorAll(".pay-option").forEach(x=>x.classList.remove("active")); e.target.closest(".pay-option").classList.add("active");
  }));
  const amount=document.getElementById("amountReceived");
  if(amount)amount.addEventListener("input",()=>{const total=cartTotal()*1.12;document.getElementById("changeDue").textContent=peso(Math.max(0,Number(amount.value)-total))});
}

setPage(pageFromHash(),false);
</script>
